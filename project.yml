# XcodeGen spec. On CI: brew install xcodegen && xcodegen generate. Nothing generated is committed.
name: Claudette
options:
  bundleIdPrefix: au.com.strapify
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-AU
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.7.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Claudette:
    type: application
    platform: iOS
    sources:
      - App
    entitlements:
      path: App/Claudette.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.claudette
        PRODUCT_NAME: Claudette
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(CL_PROFILE_APP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CodeBypass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Take a photo to send to a Claude session.
        NSPhotoLibraryUsageDescription: Choose photos to send to a Claude session.
